      a { display: inline-block; margin-top: 14px; color: #EDE7DC; text-decoration: none;
        border: 1px solid #B08D57; padding: 13px 24px; font-size: 13px;
        letter-spacing: 0.08em; text-transform: uppercase; }

    </style>
  </head>
  <body>
